name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  # Keep equal to CLAUDE_CODE_VERSION in validate.yml.
  CLAUDE_CODE_VERSION: 2.1.283

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check tag and write release notes
        run: node .github/scripts/release-notes.js "$GITHUB_REF_NAME" > release-notes.md

      - name: Install Claude Code
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: Validate
        run: |
          claude plugin validate .
          for dir in plugins/*/; do
            claude plugin validate "$dir"
          done

      - name: Run tests
        run: node --test

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag
